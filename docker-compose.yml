x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    ports:
      - "2359:2358"
    privileged: true
    <<: *default-logging
    restart: always

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    env_file:
      - ./judge0/judge0.conf
    volumes:
      - judge0_data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file:
      - ./judge0/judge0.conf
    <<: *default-logging
    restart: always

  demo:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./judge0_flask:/app:ro
    ports:
      - "5000:5000"
    environment:
      - JUDGE0_URL=http://server:2358
      - APP_PUBLIC_URL=http://demo:5000
      - ENABLE_CALLBACKS=false
      - REDIS_URL=redis://:redis_pass_change_me@redis:6379/0
    command: >
      sh -c "pip install --no-cache-dir --upgrade 'flask>=3,<4' 'requests>=2.31,<3' 'redis>=5,<9' && python3 app.py"
    depends_on:
      - server
      - redis
    <<: *default-logging
    restart: always

  web:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - ./src:/app
      - src_node_modules:/app/node_modules
      - src_next:/app/.next
    ports:
      - "5174:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - DEMO_URL=http://demo:5000
      - JUDGE0_URL=http://server:2358
      - BACKEND_API_URL=http://backend_api:8080
      - APP_REGISTRATION_PIN_CODE=1234
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    depends_on:
      - demo
    <<: *default-logging
    restart: unless-stopped

  app_db:
    image: postgres:16.2
    environment:
      POSTGRES_DB: onlinejudge
      POSTGRES_USER: onlinejudge
      POSTGRES_PASSWORD: onlinejudge
    volumes:
      - app_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlinejudge -d onlinejudge"]
      interval: 5s
      timeout: 5s
      retries: 20
    <<: *default-logging
    restart: unless-stopped

  backend_migrate:
    build:
      context: ./backend
    command: ["/usr/local/bin/migrate"]
    environment:
      APP_DATABASE_URL: postgres://onlinejudge:onlinejudge@app_db:5432/onlinejudge?sslmode=disable
      MIGRATIONS_DIR: /app/db/migrations
    depends_on:
      app_db:
        condition: service_healthy
    <<: *default-logging
    restart: "no"

  backend_api:
    build:
      context: ./backend
    command: ["/usr/local/bin/api"]
    environment:
      APP_DATABASE_URL: postgres://onlinejudge:onlinejudge@app_db:5432/onlinejudge?sslmode=disable
      APP_HTTP_ADDR: :8080
      APP_STORAGE_ROOT: /data/storage
      APP_REGISTRATION_PIN_CODE: "1234"
    volumes:
      - ./backend/storage:/data/storage
    ports:
      - "8080:8080"
    depends_on:
      backend_migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    <<: *default-logging
    restart: unless-stopped

  judge_worker:
    build:
      context: ./backend
    command: ["/usr/local/bin/judge-worker"]
    environment:
      APP_DATABASE_URL: postgres://onlinejudge:onlinejudge@app_db:5432/onlinejudge?sslmode=disable
      APP_STORAGE_ROOT: /data/storage
      WORKER_ID: worker-1
      JOB_POLL_INTERVAL: 1s
      JOB_STALE_AFTER: 10m
      OUTPUT_LIMIT_BYTES: 4194304
      JUDGE0_URL: http://server:2358
      JUDGE0_TIMEOUT: 30s
      JUDGE0_POLL_INTERVAL: 500ms
      JUDGE0_POLL_ATTEMPTS: 120
    volumes:
      - ./backend/storage:/data/storage
    depends_on:
      backend_migrate:
        condition: service_completed_successfully
    <<: *default-logging
    restart: unless-stopped

volumes:
  judge0_data:
  app_db_data:
  src_node_modules:
  src_next:

networks:
  default:
    driver: bridge
