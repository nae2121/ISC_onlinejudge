services:
  web:
    image: node:20-bookworm-slim
    volumes:
      - ./:/app
      - src_node_modules:/app/node_modules
      - src_next:/app/.next
    working_dir: /app
    ports:
      - "5174:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - DEMO_URL=http://host.docker.internal:5000
      - JUDGE0_URL=http://host.docker.internal:2359
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    restart: unless-stopped

volumes:
  src_node_modules:
  src_next:
